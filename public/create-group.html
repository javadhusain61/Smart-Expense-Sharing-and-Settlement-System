<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Group</title>

    <style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #eef4ff, #f8fafc);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #222;
    }

    .container {
        width: 90%;
        max-width: 450px;
        background: white;
        padding: 35px;
        border-radius: 16px;
        box-shadow: 0 8px 30px rgba(0,0,0,0.10);
    }

    .logo {
        text-align: center;
        font-size: 42px;
        margin-bottom: 5px;
    }

    h1 {
        text-align: center;
        color: #2563eb;
        margin: 0;
        font-size: 28px;
    }

    .subtitle {
        text-align: center;
        color: #777;
        font-size: 14px;
        margin: 8px 0 25px;
    }

    input {
        width: 100%;
        padding: 13px;
        margin: 8px 0 15px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 15px;
        outline: none;
    }

    input:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37,99,235,0.10);
    }

    button {
        width: 100%;
        padding: 13px;
        margin-top: 5px;
        border: none;
        border-radius: 8px;
        background: #2563eb;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
    }

    button:hover {
        background: #1d4ed8;
        transform: translateY(-1px);
    }

    .back {
        background: #666;
        margin-top: 10px;
    }

    .back:hover {
        background: #555;
    }

    @media (max-width: 500px) {
        .container {
            padding: 28px 22px;
        }
    }
</style>
</head>

<body>

    <div class="container">

    <div class="logo">👥</div>

    <h1>Create Group</h1>

    <p class="subtitle">
        Create a group and start sharing expenses
    </p>
        <input
            type="text"
            id="groupName"
            placeholder="Enter group name"
        >

        <button onclick="createGroup()">
            Create Group
        </button>

        <button class="back" onclick="window.location.href='dashboard.html'">
            Back to Dashboard
        </button>

    </div>

    <script>

        async function createGroup() {

            const groupName =
                document.getElementById("groupName").value;

            if (!groupName) {
                alert("Please enter group name");
                return;
            }

            try {

                const response = await fetch("/create-group", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                   body: JSON.stringify({
    group_name: groupName,
    created_by: Number(localStorage.getItem("userId"))
})
                });

                const data = await response.json();

                alert(data.message);

                if (response.ok) {
                    window.location.href = "dashboard.html";
                }

            } catch (error) {

                alert("Server connection failed");

                console.log(error);
            }
        }

    </script>

</body>

</html>
