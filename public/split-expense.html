<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Split Expense - Smart Expense Sharing</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
        }

        .container {
            width: 90%;
            max-width: 500px;
            margin: 60px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 7px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .back {
            background: #777;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background: #f4f7fb;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>💰 Split Expense</h1>

    <input
        type="number"
        id="expenseId"
        placeholder="Enter Expense ID"
    >

    <input
        type="number"
        id="userId"
        placeholder="Enter User ID"
    >

    <input
        type="number"
        id="numberOfMembers"
        placeholder="Number of Members"
        min="1"
    >

    <button onclick="splitExpense()">
        Split Equally
    </button>

    <div id="result"></div>

    <button class="back"
        onclick="window.location.href='dashboard.html'">
        Back to Dashboard
    </button>

</div>

<script>

async function splitExpense() {

    const expenseId =
        document.getElementById("expenseId").value;

    const userId =
        document.getElementById("userId").value;

    const numberOfMembers =
        document.getElementById("numberOfMembers").value;

    const result =
        document.getElementById("result");

    if (!expenseId || !userId || !numberOfMembers) {
        alert("Please fill all fields");
        return;
    }

    try {

        const response = await fetch("/split-expense", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                expense_id: Number(expenseId),
                user_id: Number(userId),
                number_of_members: Number(numberOfMembers)
            })

        });

        const data = await response.json();

        if (!response.ok) {
            alert(data.message);
            return;
        }

        result.innerHTML = `
            <h3>Split Result</h3>
            <p>Total Expense: ₹${data.total}</p>
            <p>Members: ${data.members}</p>
            <p>Each Person Pays: ₹${data.share}</p>
        `;

    } catch (error) {

        console.log(error);
        alert("Server connection failed");

    }
}

</script>

</body>
</html>
