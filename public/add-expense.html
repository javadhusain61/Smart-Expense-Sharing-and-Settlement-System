<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Expense - SplitMate</title>
    <style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #eef4ff, #f8fafc);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #222;
    }

    .container {
        width: 90%;
        max-width: 450px;
        background: white;
        padding: 35px;
        border-radius: 16px;
        box-shadow: 0 8px 30px rgba(0,0,0,0.10);
    }

    .logo {
        text-align: center;
        font-size: 42px;
        margin-bottom: 5px;
    }

    h1 {
        text-align: center;
        color: #2563eb;
        margin: 0;
        font-size: 28px;
    }

    .subtitle {
        text-align: center;
        color: #777;
        font-size: 14px;
        margin: 8px 0 25px;
    }

    input,
    select {
        width: 100%;
        padding: 13px;
        margin: 8px 0;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 15px;
        outline: none;
        background: white;
    }

    input:focus,
    select:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37,99,235,0.10);
    }

    button {
        width: 100%;
        padding: 13px;
        margin-top: 10px;
        border: none;
        border-radius: 8px;
        background: #2563eb;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
    }

    button:hover {
        background: #1d4ed8;
        transform: translateY(-1px);
    }

    .back {
        background: #666;
    }

    .back:hover {
        background: #555;
    }

    @media (max-width: 500px) {
        .container {
            padding: 28px 22px;
        }
    }
</style>
</head>

<body>

<div class="container">

    <div class="logo">💰</div>

    <h1>Add Expense</h1>

    <p class="subtitle">
        Record and split a shared expense
    </p>>

    <input
        type="number"
        id="groupId"
        placeholder="Enter Group ID"
    >

    <select id="paidBy">
    <option value="">Select who paid</option>
</select>
    

    <input
        type="text"
        id="description"
        placeholder="Expense Description"
    >

    <input
        type="number"
        id="amount"
        placeholder="Enter Amount"
        step="0.01"
    >

    <button onclick="addExpense()">
        Add Expense
    </button>

    <button class="back"
        onclick="window.location.href='dashboard.html'">
        Back to Dashboard
    </button>

</div>

<script>

const urlParams = new URLSearchParams(window.location.search);
const groupId = urlParams.get("group_id");


window.onload = function () {

    if (!groupId) {
        alert("Group ID not found");
        window.location.href = "my-groups.html";
        return;
    }

    document.getElementById("groupId").value = groupId;
    document.getElementById("groupId").readOnly = true;

    loadMembers();
};


async function loadMembers() {

    try {

        const response =
            await fetch(`/group-members/${groupId}`);

        const members =
            await response.json();

        const paidBy =
            document.getElementById("paidBy");

        if (!response.ok) {
            alert("Unable to load group members");
            return;
        }

        members.forEach(member => {

            const option =
                document.createElement("option");

            option.value = member.user_id;

            option.textContent =
                `${member.name} (${member.email})`;

            paidBy.appendChild(option);

        });

    } catch (error) {

        console.log(error);

        alert("Unable to load group members");

    }
}


async function addExpense() {

    const paidBy =
        document.getElementById("paidBy").value;

    const description =
        document.getElementById("description").value;

    const amount =
        document.getElementById("amount").value;


    if (!groupId || !paidBy || !description || !amount) {

        alert("Please fill all fields");

        return;
    }


    try {

        const response =
            await fetch("/add-expense", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    group_id: Number(groupId),

                    paid_by: Number(paidBy),

                    description: description,

                    amount: Number(amount)

                })

            });


        const data =
            await response.json();

        alert(data.message);


        if (response.ok) {

            window.location.href =
                `group-details.html?group_id=${groupId}`;

        }


    } catch (error) {

        console.log(error);

        alert("Server connection failed");

    }
}

</script>

</body>
</html>
