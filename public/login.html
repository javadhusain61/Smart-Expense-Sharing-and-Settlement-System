<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - SplitMate</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f8ff;

            display: flex;
            justify-content: center;
            align-items: center;

            position: relative;
        }

        /* Background decoration */

        .circle-top {
            position: fixed;
            width: 300px;
            height: 300px;
            background: #dceaff;
            border-radius: 50%;
            top: -150px;
            left: -150px;
            z-index: -1;
        }

        .circle-bottom {
            position: fixed;
            width: 340px;
            height: 340px;
            background: #dceaff;
            border-radius: 50%;
            right: -170px;
            bottom: -170px;
            z-index: -1;
        }

        /* Main card */

        .login-card {
            width: 92%;
            max-width: 500px;

            background: white;

            padding: 30px 38px 25px;

            border-radius: 18px;

            box-shadow:
                0 10px 30px rgba(30, 70, 120, 0.14);

            margin: 20px auto;
        }

        /* Logo */

        .logo-icon {
            width: 62px;
            height: 62px;

            margin: 0 auto 7px;

            border-radius: 50%;

            background: #eef5ff;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 32px;
        }

        .logo-name {
            margin: 0;

            text-align: center;

            font-size: 32px;

            color: #17233a;

            letter-spacing: -0.5px;
        }

        .logo-name span {
            color: #1677f9;
        }

        /* Subtitle */

        .subtitle {
            text-align: center;

            margin: 5px 0 3px;

            color: #66758f;

            font-size: 17px;
        }

        .description {
            text-align: center;

            margin: 0 auto 22px;

            max-width: 390px;

            color: #8793a7;

            font-size: 13px;

            line-height: 1.4;
        }

        /* Heading */

        .form-title {
            margin: 0 0 12px;

            color: #17233a;

            font-size: 21px;
        }

        /* Input */

        .input-box {
            position: relative;

            margin-bottom: 12px;
        }

        .input-icon {
            position: absolute;

            left: 13px;
            top: 50%;

            transform: translateY(-50%);

            width: 28px;
            height: 28px;

            border-radius: 7px;

            background: #edf4ff;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 15px;

            z-index: 1;
        }

        input {
            width: 100%;

            height: 48px;

            padding: 0 15px 0 55px;

            border: 1px solid #d8e1ed;

            border-radius: 9px;

            outline: none;

            font-size: 14px;

            color: #263244;

            background: white;

            transition: 0.2s;
        }

        input::placeholder {
            color: #8b96a8;
        }

        input:focus {
            border-color: #1677f9;

            box-shadow:
                0 0 0 3px rgba(22, 119, 249, 0.08);
        }

        /* Login button */

        .login-button {
            width: 100%;

            height: 49px;

            margin-top: 5px;

            border: none;

            border-radius: 9px;

            background: linear-gradient(
                135deg,
                #2196ff,
                #086df5
            );

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;

            box-shadow:
                0 6px 15px rgba(22, 119, 249, 0.20);
        }

        .login-button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 9px 20px rgba(22, 119, 249, 0.28);
        }

        .login-button:active {
            transform: translateY(0);
        }

        /* Register link */

        .register-text {
            text-align: center;

            margin: 17px 0 0;

            color: #68758a;

            font-size: 14px;
        }

        .register-text a {
            color: #1677f9;

            font-weight: 600;

            text-decoration: none;

            margin-left: 4px;
        }

        .register-text a:hover {
            text-decoration: underline;
        }

        /* Mobile */

        @media (max-width: 600px) {

            .login-card {
                width: 92%;

                padding: 25px 22px 22px;
            }

            .logo-icon {
                width: 55px;
                height: 55px;

                font-size: 28px;
            }

            .logo-name {
                font-size: 28px;
            }

            .subtitle {
                font-size: 16px;
            }

            .description {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <!-- Background -->

    <div class="circle-top"></div>
    <div class="circle-bottom"></div>


    <!-- Login Card -->

    <div class="login-card">

        <!-- Logo -->

        <div class="logo-icon">
            💰
        </div>

        <h1 class="logo-name">
            Split<span>Mate</span>
        </h1>

        <p class="subtitle">
            Welcome back
        </p>

        <p class="description">
            Login to manage your shared expenses
            with your friends.
        </p>


        <!-- Login -->

        <h2 class="form-title">
            Login
        </h2>


        <!-- Email -->

        <div class="input-box">

            <span class="input-icon">
                ✉
            </span>

            <input
                type="email"
                id="email"
                placeholder="Enter Email"
            >

        </div>


        <!-- Password -->

        <div class="input-box">

            <span class="input-icon">
                🔒
            </span>

            <input
                type="password"
                id="password"
                placeholder="Enter Password"
            >

        </div>


        <!-- Login Button -->

        <button
            class="login-button"
            onclick="loginUser()"
        >
            Login&nbsp; →
        </button>


        <!-- Register -->

        <p class="register-text">
            Don't have an account?
            <a href="register.html">Register</a>
        </p>

    </div>


    <script>

        async function loginUser() {

            const email =
                document.getElementById("email").value;

            const password =
                document.getElementById("password").value;


            if (!email || !password) {

                alert("Please fill all fields");

                return;
            }


            try {

                const response = await fetch("/login", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({

                        email: email,

                        password: password

                    })

                });


                const data =
                    await response.json();


                if (response.ok) {

                    localStorage.setItem(
                        "userId",
                        data.user.user_id
                    );

                    localStorage.setItem(
                        "userName",
                        data.user.name
                    );

                    alert("Login successful!");

                    window.location.href =
                        "dashboard.html";

                } else {

                    alert(
                        data.message ||
                        "Invalid email or password"
                    );

                }

            } catch (error) {

                console.log(error);

                alert(
                    "Server connection failed"
                );

            }

        }

    </script>

</body>

</html>
